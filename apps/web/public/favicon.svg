<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- deplox brand mark: three stacked rounded squares.
       bottom = repo (dim), middle = build (mid), top = live URL (full).
       Dark rounded background so the mark is visible on light browser tabs
       (light/dark mode media query handles the rest). -->
  <rect width="32" height="32" rx="6" fill="#0a0a0a"/>
  <rect x="4" y="20" width="18" height="8" rx="2" fill="#ffffff" opacity="0.35"/>
  <rect x="7" y="12" width="18" height="8" rx="2" fill="#ffffff" opacity="0.65"/>
  <rect x="10" y="4" width="18" height="8" rx="2" fill="#ffffff" opacity="1"/>
</svg>