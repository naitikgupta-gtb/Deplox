<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#171717"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- brand mark — three rounded diamonds, top-left -->
  <g transform="translate(80, 60)">
    <!-- bottom diamond (dim) -->
    <rect x="18" y="26" width="28" height="28" rx="5"
          fill="#fafafa" opacity="0.3"
          transform="rotate(45 32 40)"/>
    <!-- middle diamond (mid) -->
    <rect x="18" y="18" width="28" height="28" rx="5"
          fill="#fafafa" opacity="0.6"
          transform="rotate(45 32 32)"/>
    <!-- top diamond (full) -->
    <rect x="18" y="10" width="28" height="28" rx="5"
          fill="#fafafa" opacity="1"
          transform="rotate(45 32 24)"/>
    <text x="80" y="38"
          font-family="Inter, system-ui, sans-serif" font-size="32" font-weight="600"
          fill="#fafafa" letter-spacing="-0.04em">deplox</text>
  </g>

  <!-- hero copy -->
  <g transform="translate(80, 240)">
    <text font-family="Inter, system-ui, sans-serif" font-size="32" font-weight="600"
          fill="#a3a3a3" letter-spacing="6">DEPLOY · BUILD · SCALE</text>
    <text y="120" font-family="Inter, system-ui, sans-serif" font-size="84" font-weight="700"
          fill="#fafafa">Deploy your GitHub repo.</text>
    <text y="220" font-family="Inter, system-ui, sans-serif" font-size="84" font-weight="700"
          fill="#737373">In 2 minutes.</text>
    <text y="320" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="400"
          fill="#a3a3a3">HTTPS · Encrypted secrets · Instant rollback · Free subdomain</text>
  </g>

  <!-- footer -->
  <g transform="translate(1100, 580)" font-family="Inter, system-ui, sans-serif"
     font-size="20" fill="#525252" text-anchor="end">
    <text>deplox.site</text>
  </g>
</svg>